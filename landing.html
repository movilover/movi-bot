<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#07060d"/>
<title>Movi Lover — প্রিমিয়াম ভিডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07060d; --card:rgba(255,255,255,.055); --stroke:rgba(255,255,255,.10);
  --gold:#f2b830; --gold2:#ffd36a; --gold3:#d99a14;
  --text:#f6efe2; --muted:#a79cb8; --green:#2fd08a; --red:#ff6b7d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100%;overflow-x:hidden}
body{position:relative}
/* aurora background */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite}
.aurora i:nth-child(1){width:340px;height:340px;left:-90px;top:-80px;background:#b3253c}
.aurora i:nth-child(2){width:300px;height:300px;right:-100px;top:20%;background:#7c3aed;animation-delay:-6s;opacity:.4}
.aurora i:nth-child(3){width:320px;height:320px;left:10%;bottom:-120px;background:#f2b830;animation-delay:-11s;opacity:.28}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.12)}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(70% 55% at 50% 30%,#000,transparent)}
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particles span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.4}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}

.wrap{max-width:440px;margin:0 auto;padding:14px 16px calc(34px + env(safe-area-inset-bottom));position:relative;z-index:2}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:17px;letter-spacing:.6px}
.logo .gem{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 6px 16px rgba(242,184,48,.4)}
.back-pill{font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:12px;color:var(--text);text-decoration:none;padding:8px 13px;border-radius:30px;background:var(--card);border:1px solid var(--stroke);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}
.back-pill:active{transform:scale(.97)}

/* hero */
.hero{text-align:center;margin-top:6px}
.title{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(32px,10.5vw,44px);line-height:1.05;
  background:linear-gradient(180deg,#fff3c4 0%,#f2b830 48%,#b87912 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(242,184,48,.35));letter-spacing:1px}
.subtitle{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;margin-top:6px;letter-spacing:.4px}
.subtitle .em{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.subtitle .em:nth-child(2){animation-delay:.2s}.subtitle .em:nth-child(3){animation-delay:.4s}.subtitle .em:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.tagline{color:var(--muted);font-size:12.5px;margin-top:4px}
.tagline b{color:var(--gold2);font-weight:600}

/* 3D stage (compact) */
.stage{height:150px;margin:2px auto 0;perspective:800px;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.scene{width:84px;height:84px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(25deg);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotateX(-18deg) rotateY(385deg)}}
.face{position:absolute;width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px;border:1px solid rgba(255,255,255,.3);backface-visibility:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.04) 45%,rgba(0,0,0,.25)),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:inset 0 0 20px rgba(255,255,255,.18)}
.f1{--c1:#b3253c;--c2:#5a0c22;transform:translateZ(42px)}
.f2{--c1:#f2b830;--c2:#a46a0a;transform:rotateY(90deg) translateZ(42px)}
.f3{--c1:#7c3aed;--c2:#34146e;transform:rotateY(180deg) translateZ(42px)}
.f4{--c1:#0ea5a4;--c2:#06504f;transform:rotateY(-90deg) translateZ(42px)}
.f5{--c1:#ff7a3d;--c2:#9a2c0b;transform:rotateX(90deg) translateZ(42px)}
.f6{--c1:#2563eb;--c2:#0b2a72;transform:rotateX(-90deg) translateZ(42px)}
.floor{position:absolute;bottom:8px;left:50%;width:130px;height:24px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(242,184,48,.45),transparent);filter:blur(6px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:translateX(-50%) scale(.85)}}
.card3d{position:absolute;width:56px;height:80px;border-radius:11px;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.03)),linear-gradient(135deg,#2a1b45,#0e0818);box-shadow:0 14px 24px rgba(0,0,0,.45);animation:fl 5s ease-in-out infinite}
.c-a{left:6%;top:24%;transform:rotateY(24deg) rotateZ(-8deg)}
.c-b{right:6%;top:14%;transform:rotateY(-24deg) rotateZ(9deg);animation-delay:.9s}
@keyframes fl{50%{translate:0 -10px}}

/* main card */
.panel{margin-top:4px;border-radius:26px;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
  border:1px solid rgba(242,184,48,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.head{display:flex;align-items:center;gap:12px}
.ico{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 8px 18px rgba(242,184,48,.35);flex-shrink:0}
.h-name{font-weight:700;font-size:15px;line-height:1.3;word-break:break-word}
.chip{display:inline-block;margin-top:4px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.6px;color:var(--gold2);background:rgba(242,184,48,.12);border:1px solid rgba(242,184,48,.3);padding:2px 10px;border-radius:30px}

/* timeline */
.steps{display:flex;gap:6px;margin:16px 0 4px}
.stp{flex:1;text-align:center;font-size:10.5px;color:var(--muted);position:relative;padding-top:24px;font-weight:600}
.stp::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--stroke);font-family:'Rajdhani',sans-serif;font-weight:800;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.stp::after{content:'';position:absolute;top:10px;left:calc(50% + 14px);right:calc(-50% + 14px);height:1px;background:var(--stroke)}
.stp:last-child::after{display:none}
.stp.on{color:var(--gold2)}.stp.on::before{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#2a1c05;border-color:transparent;box-shadow:0 0 14px rgba(242,184,48,.5)}
.stp.ok{color:var(--green)}.stp.ok::before{content:'✓';background:var(--green);color:#04281a;border-color:transparent}

/* timer button */
.timer-zone{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:14px}
.timer{position:relative;width:176px;height:176px;border:none;background:none;cursor:pointer;border-radius:50%;outline:none;color:inherit;font:inherit}
.timer:disabled{cursor:default}
.timer .glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(242,184,48,.5),transparent 70%);animation:glow 1.8s ease-in-out infinite}
.timer.running .glow{animation:none;opacity:.25}
.timer.done .glow{background:radial-gradient(closest-side,rgba(47,208,138,.55),transparent 70%);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.12);opacity:.55}}
.timer svg{position:absolute;inset:0;width:176px;height:176px;transform:rotate(-90deg)}
.timer .bg{fill:rgba(10,7,18,.78);stroke:rgba(255,255,255,.10);stroke-width:9}
.timer .fg{fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;stroke-dasharray:439.8;stroke-dashoffset:439.8;transition:stroke-dashoffset .5s linear}
.timer.idle .fg{stroke-dashoffset:0;opacity:.9;animation:ringPulse 1.8s ease-in-out infinite}
@keyframes ringPulse{50%{opacity:.45}}
.timer.done .fg{stroke:url(#gg);stroke-dashoffset:0}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:800;line-height:1}
.timer .num b{font-size:58px;text-shadow:0 0 24px rgba(242,184,48,.45)}
.timer .num small{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:1.4px;margin-top:5px}
.timer:active:not(:disabled){transform:scale(.97)}

/* hand hint */
.hand{position:absolute;right:calc(50% - 112px);top:104px;width:70px;pointer-events:none;z-index:3;display:none;transform-origin:50% 90%;animation:tapHand 1.5s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.hand .fing{font-size:52px;line-height:1;display:block;transform:rotate(-18deg)}
.hand.show{display:block}
@keyframes tapHand{0%,100%{transform:translate(0,0)}45%{transform:translate(-34px,-30px)}55%{transform:translate(-34px,-30px) scale(.88)}}
.tap-ripple{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid var(--gold2);opacity:0;pointer-events:none;animation:ripple 1.5s ease-out infinite;z-index:2;display:none}
.tap-ripple.show{display:block}
@keyframes ripple{0%,40%{transform:scale(.4);opacity:0}55%{opacity:.9}100%{transform:scale(3.3);opacity:0}}
.bubble{margin-top:14px;font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:13px;color:#2a1c05;background:linear-gradient(135deg,var(--gold2),var(--gold3));padding:8px 16px;border-radius:30px;box-shadow:0 10px 22px rgba(242,184,48,.35);animation:bob 1.6s ease-in-out infinite;display:none}
.bubble.show{display:block}

.status{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.65;min-height:42px}
.status b{color:var(--gold2)}

/* result */
.result{display:none;margin-top:6px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.result.show{display:block}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ok-box{padding:16px 12px;border-radius:20px;background:linear-gradient(180deg,rgba(47,208,138,.16),rgba(47,208,138,.04));border:1px solid rgba(47,208,138,.45)}
.ok-lbl{font-size:12px;color:var(--green);font-weight:700}
.ok-big{font-size:16px;font-weight:700;line-height:1.55;margin-top:6px}
.code{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:44px;letter-spacing:10px;color:#fff;margin:6px 0 0;padding-left:10px;text-shadow:0 0 24px rgba(47,208,138,.65);user-select:all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;border:none;font-family:'Hind Siliguri',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;margin-top:10px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#2a1c05;box-shadow:0 12px 26px rgba(242,184,48,.32)}
.btn.tg{background:linear-gradient(135deg,#38b6ff,#1d7fd6);color:#fff;box-shadow:0 12px 26px rgba(29,127,214,.35)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--stroke)}
.sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.55}
.fallback{display:none;margin-top:10px}
.fallback.show{display:flex}
.hint{margin-top:14px;font-size:11px;color:#8d83a0;line-height:1.65;text-align:center}
.err{padding:22px 14px;text-align:center;color:#ff8a98;font-size:14px;line-height:1.7}
.footer{margin-top:16px;text-align:center;font-size:10.5px;color:#6f6580}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<div class="wrap">
  <div class="top">
    <div class="logo"><span class="gem">🎬</span>Movi Lover</div>
    <a class="back-pill" id="topBack" href="#">← অ্যাপে ফিরুন</a>
  </div>

  <div class="hero">
    <div class="stage" id="stage">
      <div class="floor"></div>
      <div class="card3d c-a">🍿</div><div class="card3d c-b">⭐</div>
      <div class="scene"><div class="face f1">🎬</div><div class="face f2">💎</div><div class="face f3">🔥</div><div class="face f4">🎞️</div><div class="face f5">🍿</div><div class="face f6">⭐</div></div>
    </div>
    <div class="title">Movi Lover</div>
    <div class="subtitle">Movi Lover Video <span class="em">🎬</span><span class="em">🔥</span><span class="em">💎</span><span class="em">🌐</span></div>
    <div class="tagline"><b>সকল ধরনের প্রিমিয়াম ভিডিও</b> পাওয়া যায়</div>
  </div>

  <div class="panel" id="panel"><div class="err" id="loading">⏳ লোড হচ্ছে...</div></div>
  <div class="footer">© Movi Lover • Premium Video Club</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDse8sC_hsrHrLx92zUobO7PezW0SUChHQ",
  authDomain: "movi-vairal.firebaseapp.com",
  projectId: "movi-vairal",
  storageBucket: "movi-vairal.firebasestorage.app",
  messagingSenderId: "343081500219",
  appId: "1:343081500219:web:072eaec3f2d47a4c36661e"
};
const BOT_LINK = 'https://t.me/movilovervairal_bot/webapp';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- decoration ---------- */
(function(){
  const em = ['🎬','🍿','💎','🔥','⭐','🎞️','✨','🎥'];
  const box = $('particles');
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.textContent = em[i % em.length];
    s.style.left = (Math.random()<.5 ? Math.random()*9 : 89+Math.random()*9) + '%';
    s.style.fontSize = (15 + Math.random()*16) + 'px';
    s.style.animationDuration = (12 + Math.random()*12) + 's';
    s.style.animationDelay = (-Math.random()*20) + 's';
    box.appendChild(s);
  }
  const stage = $('stage');
  const tilt = (x,y)=>{ stage.style.transform = 'rotateX(' + (y*-7) + 'deg) rotateY(' + (x*9) + 'deg)'; };
  addEventListener('pointermove', e=>tilt((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2), {passive:true});
  addEventListener('deviceorientation', e=>{ if(e.gamma!=null) tilt(Math.max(-1,Math.min(1,e.gamma/30)), Math.max(-1,Math.min(1,(e.beta-45)/40))); }, {passive:true});
})();

/* ---------- parameters ---------- */
const qs = new URLSearchParams(location.search);
const hs = new URLSearchParams(location.hash.replace(/^#/, ''));
const unlockToken = (qs.get('k') || '').trim();
const MODE_UNLOCK = !!unlockToken;
const taskId = (qs.get('t') || '').trim();
const videoId = (qs.get('v') || '').trim();
const stepNo = Math.max(1, parseInt(qs.get('s')) || 1);
let code = (hs.get('c') || '').trim();
const KEY = 'ml_land_' + (MODE_UNLOCK ? ('u_' + unlockToken) : taskId);
let saved = {};
try{ saved = JSON.parse(sessionStorage.getItem(KEY) || '{}'); }catch(e){}
const save = () => { try{ sessionStorage.setItem(KEY, JSON.stringify(saved)); }catch(e){} };
if(!MODE_UNLOCK){
  if(code){ saved.code = code; save(); } else code = saved.code || '';
  try{ history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(taskId)); }catch(e){}
}
// "back to the app" always lands on the right place: the same video, or the task list
const backUrl = MODE_UNLOCK ? (BOT_LINK + '?startapp=v-' + encodeURIComponent(videoId)) : (BOT_LINK + '?startapp=tk');
$('topBack').href = backUrl;

function fail(msg){ $('panel').innerHTML = '<div class="err">⚠️ ' + esc(msg) + '<a class="btn gold" href="' + BOT_LINK + '">টেলিগ্রামে ফিরে যান</a></div>'; }
const wrapLinks = arr => (Array.isArray(arr) ? arr : []).filter(l => l && /^https?:\/\//i.test(l.url || ''));
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

async function main(){
  const idOk = x => /^[A-Za-z0-9]{10,40}$/.test(x);
  if(MODE_UNLOCK){
    if(!/^[A-Za-z0-9]{16,32}$/.test(unlockToken) || !idOk(videoId)){ fail('লিংকটি সঠিক নয় বা মেয়াদ শেষ। টেলিগ্রামের অ্যাপ থেকে ভিডিওতে আবার ট্যাপ করুন।'); return; }
  } else if(!idOk(taskId) || !/^\d{6}$/.test(code)){
    fail('লিংকটি সঠিক নয় বা মেয়াদ শেষ। টেলিগ্রামের অ্যাপ থেকে টাস্কে আবার "শুরু করুন" চাপুন।'); return;
  }
  let db, cfg;
  try{
    db = getFirestore(initializeApp(firebaseConfig));
    if(MODE_UNLOCK){
      const [vs, ls] = await Promise.all([getDoc(doc(db, 'videos', videoId)), getDoc(doc(db, 'settings', 'landing')).catch(() => null)]);
      if(!vs.exists()){ fail('ভিডিওটি পাওয়া যায়নি।'); return; }
      const v = vs.data();
      const w = ls && ls.exists() ? parseInt(ls.data().unlockWaitSeconds) : 15;
      let links = wrapLinks(v.directLinkSets && v.directLinkSets[String(stepNo)]);
      if(!links.length && v.directLinks && v.directLinks[String(stepNo)]) links = wrapLinks([{ name:'Direct', url:v.directLinks[String(stepNo)] }]);
      const total = Math.max(1, parseInt(v.adsRequired) || 3);
      cfg = { icon:'🔓', title:v.title || 'ভিডিও', chip:'ধাপ ' + bn(stepNo) + ' / ' + bn(total), wait:Math.min(120, Math.max(5, w || 15)), links };
    } else {
      const snap = await getDoc(doc(db, 'tasks', taskId));
      if(!snap.exists()){ fail('টাস্কটি পাওয়া যায়নি।'); return; }
      const t = snap.data();
      if(t.active === false){ fail('এই টাস্কটি এখন বন্ধ আছে।'); return; }
      cfg = { icon:'🎁', title:t.title || 'টাস্ক', chip:'+৳ ' + (Number(t.reward) || 0).toFixed(2), wait:Math.min(120, Math.max(5, parseInt(t.waitSeconds) || 15)), links:wrapLinks(t.adLinks) };
    }
  }catch(e){ fail('সার্ভারে সংযোগ করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।'); return; }

  const { wait, links } = cfg;
  // one random network per attempt: every network gets traffic over time
  if(typeof saved.pick !== 'number' || saved.pick >= links.length){ saved.pick = links.length ? Math.floor(Math.random() * links.length) : -1; save(); }
  const adUrl = saved.pick >= 0 ? links[saved.pick].url : '';

  const stepLabels = MODE_UNLOCK ? ['ক্লিক করুন','অপেক্ষা','অ্যাপে ফিরুন'] : ['ক্লিক করুন','কোড নিন','অ্যাপে সাবমিট'];
  $('panel').innerHTML =
    '<div class="head"><div class="ico">' + cfg.icon + '</div><div><div class="h-name">' + esc(cfg.title) + '</div><span class="chip">' + esc(cfg.chip) + '</span></div></div>' +
    '<div class="steps">' + stepLabels.map((l,i)=>'<div class="stp" data-n="' + bn(i+1) + '" id="stp' + i + '">' + l + '</div>').join('') + '</div>' +
    '<div class="timer-zone">' +
      '<button class="timer idle" id="timer" aria-label="টাইমার চালু করুন"><span class="glow"></span>' +
        '<svg viewBox="0 0 160 160"><defs>' +
          '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36a"/><stop offset="1" stop-color="#e8aa1c"/></linearGradient>' +
          '<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff0b8"/><stop offset="1" stop-color="#1fb877"/></linearGradient></defs>' +
          '<circle class="bg" cx="80" cy="80" r="70"/><circle class="fg" id="fg" cx="80" cy="80" r="70"/></svg>' +
        '<span class="num"><b id="sec">' + bn(wait) + '</b><small id="unit">সেকেন্ড</small></span>' +
        '<span class="tap-ripple show" id="ripple"></span>' +
      '</button>' +
      '<div class="hand show" id="hand"><span class="fing">👆</span></div>' +
      '<div class="bubble show" id="bubble">👆 ' + bn(wait) + ' সেকেন্ডের টাইমারে ক্লিক করুন</div>' +
    '</div>' +
    '<div class="status" id="status"></div>' +
    '<div class="fallback" id="fallback"><a class="btn ghost" id="fbLink" target="_blank" rel="noopener noreferrer nofollow">↗ বিজ্ঞাপন পেজ খুলুন</a></div>' +
    '<div class="result" id="result"></div>' +
    '<a class="btn ghost" id="bottomBack" href="' + backUrl + '" style="display:none;"></a>' +
    '<div class="hint">' + (MODE_UNLOCK ? 'পুরো সময় অপেক্ষা না করে ব্যাক করলে এই ধাপ সম্পন্ন হবে না।' : 'কোড কপি করে অ্যাপে ফিরে গিয়ে টাস্কের ঘরে বসান — সাথে সাথে ব্যালেন্স যোগ হবে।') + '</div>';

  $('topBack').addEventListener('click', e => {
    if(!finished && saved.t0 && !confirm('সময় শেষ হয়নি! এখন ফিরে গেলে এই ধাপ সম্পন্ন হবে না। তবুও ফিরবেন?')) e.preventDefault();
  });

  const C = 439.8;
  const timerBtn = $('timer'), fg = $('fg');
  let finished = false, finishing = false, ticker = null;
  const setSteps = (on, ok) => stepLabels.forEach((_, i) => { const el = $('stp' + i); el.className = 'stp' + (i < ok ? ' ok' : (i === on ? ' on' : '')); });
  setSteps(0, 0);
  $('status').innerHTML = MODE_UNLOCK
    ? 'উপরের <b>টাইমারে ক্লিক</b> করুন — টাইমার চালু হবে এবং বিজ্ঞাপন পেজ খুলবে।'
    : 'উপরের <b>টাইমারে ক্লিক</b> করুন — গণনা শুরু হবে।';

  function openAd(){
    if(!adUrl) return;
    let w = null;
    try{ w = window.open(adUrl, '_blank'); }catch(e){}
    if(!w){ $('fbLink').href = adUrl; $('fallback').classList.add('show'); }
  }
  function startTimer(){
    saved.t0 = Date.now(); save();
    beginRunning();
    if(MODE_UNLOCK) openAd();
  }
  function beginRunning(){
    timerBtn.classList.remove('idle'); timerBtn.classList.add('running'); timerBtn.disabled = true;
    $('hand').classList.remove('show'); $('bubble').classList.remove('show'); $('ripple').classList.remove('show');
    setSteps(1, 1);
    if(!ticker){ ticker = setInterval(tick, 400); }
    tick();
  }
  timerBtn.addEventListener('click', () => { if(!saved.t0) startTimer(); });

  function showTaskResult(){
    $('result').innerHTML =
      '<div class="ok-box"><div class="ok-lbl">✅ আপনার ভেরিফিকেশন কোড</div><div class="code" id="codeVal">' + esc(code) + '</div></div>' +
      '<button class="btn gold" id="copyBtn">📋 কোড কপি করুন</button>' +
      '<div class="sub">কপি করলে কোডটি কপি হয়ে যাবে এবং বিজ্ঞাপন পেজ খুলবে।<br>তারপর অ্যাপে ফিরে গিয়ে কোডটি বসান।</div>' +
      '<a class="btn tg" href="' + backUrl + '">↩️ অ্যাপে ফিরে যান (টাস্ক পেজে)</a>';
    $('result').classList.add('show');
    $('copyBtn').addEventListener('click', async () => {
      // copy first (inside the click), then open the direct link
      let ok = false;
      try{ await navigator.clipboard.writeText(code); ok = true; }catch(e){
        try{ const r = document.createRange(); r.selectNodeContents($('codeVal')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ok = document.execCommand('copy'); }catch(_){}
      }
      $('copyBtn').textContent = ok ? '✅ কোড কপি হয়েছে' : 'কোডটি সিলেক্ট করা আছে — কপি করুন';
      if(!saved.opened){ saved.opened = true; save(); }
      openAd();
    });
  }
  function showUnlockResult(){
    $('result').innerHTML =
      '<div class="ok-box"><div class="ok-lbl">✅ ধাপ সম্পন্ন!</div><div class="ok-big">এখন অ্যাপে ফিরে যান —<br>আপনার ভিডিওর ধাপ সম্পন্ন হয়ে গেছে।</div></div>' +
      '<a class="btn tg" href="' + backUrl + '">↩️ অ্যাপে ফিরে যান</a>';
    $('result').classList.add('show');
  }
  async function finishUnlock(){
    if(finishing) return; finishing = true;
    $('status').innerHTML = '⏳ সম্পন্ন করা হচ্ছে...';
    try{
      await setDoc(doc(db, 'unlock_done', unlockToken), { doneAt: serverTimestamp() });
      complete(true);
    }catch(e){
      finishing = false;
      $('status').innerHTML = '⚠️ নিশ্চিত করা যায়নি — আবার চেষ্টা করছি...';
    }
  }
  function complete(unlock){
    finished = true; clearInterval(ticker);
    timerBtn.classList.remove('running'); timerBtn.classList.add('done');
    $('sec').textContent = '✓'; $('unit').textContent = 'সম্পন্ন'; fg.style.strokeDashoffset = 0;
    $('status').innerHTML = unlock ? '🎉 অভিনন্দন! ধাপটি সম্পন্ন হয়েছে।' : '🎉 সময় শেষ! নিচের কোডটি নিন।';
    setSteps(2, 2);
    unlock ? showUnlockResult() : showTaskResult();
  }
  function tick(){
    if(finished || !saved.t0) return;
    // timestamp based: throttled timers or background tabs can't change the real elapsed time
    const elapsed = (Date.now() - saved.t0) / 1000;
    const left = Math.max(0, Math.ceil(wait - elapsed));
    $('sec').textContent = bn(left);
    fg.style.strokeDashoffset = String(C * (1 - Math.min(1, elapsed / wait)));
    if(left > 0){ $('status').innerHTML = 'পুরো সময় অপেক্ষা করুন। <b>আগে ব্যাক করলে</b> ধাপ সম্পন্ন হবে না।'; return; }
    if(MODE_UNLOCK) finishUnlock(); else complete(false);
  }
  document.addEventListener('visibilitychange', tick);

  // returning to an already running / finished attempt (page reloaded)
  if(saved.t0) beginRunning();
}
main();
</script>
</body>
</html>
